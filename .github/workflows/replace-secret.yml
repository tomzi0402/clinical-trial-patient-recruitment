name: Print Secret
run-name: ${{ github.actor }} is doing push
on:
  push:
    branches: [ "tomzi0402-patch-1" ]

jobs:
  print-secret:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app    

    steps:
      - uses: actions/checkout@v4

      - name: Print secret variable
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
        run: |
          echo "$API_ENDPOINT" | sed 's/./& /g'

      - name: List out workspace
        run: ls ${{ github.workspace }}

      - name: Check the content before replacing by secret variables
        run: head -n 50 src/App.js

      # core part to replace secret variables
      - name: Find and Replace by secret variables
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "%API_ENDPOINT%"
          replace: ${{ secrets.API_ENDPOINT }}
          regex: false
          include: '**App.js'

      - name: Check the content after replacing by secret variables
        run: head -n 50 src/App.js | sed 's/./& /g'        
