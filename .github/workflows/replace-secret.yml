name: Print Secret
run-name: ${{ github.actor }} is doing push
on:
  push:
    branches: [ "tomzi0402-patch-1" ]

jobs:
  print-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Print secret variable
        run: |
          echo "MY_SECRET is: ${{ secrets.API_ENDPOINT }}"
        env:
          MY_SECRET: ${{ secrets.API_ENDPOINT }}